name: Publish to PyPI

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Requires a `pypi` environment (repo Settings -> Environments) and a
    # Trusted Publisher on PyPI: GitHub Actions / wsu2059q / tomlclass / pypi-publish.yml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/tomlclass/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
